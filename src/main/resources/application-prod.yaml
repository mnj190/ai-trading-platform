spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: trading
    default-schema: trading
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: trading

kis:
  api:
    base-url: ${KIS_API_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
    account-number: ${KIS_ACCOUNT_NUMBER}
    account-product-code: ${KIS_ACCOUNT_PRODUCT_CODE:01}
    paper-trading: ${KIS_PAPER_TRADING:false}
